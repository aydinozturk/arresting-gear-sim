name: Simulatoru GitHub Pages'e yayinla

# Sayfa her zaman ui/engine.js'ten yeniden uretilir; boylece yayindaki
# tezgah ile depodaki motor birbirinden ayrisamaz.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tek dosyalik simulatoru uret
        run: python3 ui/build.py

      - name: Siteyi topla
        run: |
          mkdir -p _site
          cp ui/simulator.html _site/index.html
          echo aag.aydinozturk.com > _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
